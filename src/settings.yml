---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor: ''
polling_url: "{%- assign vk_base = base_url | default: 'https://app.vikunja.cloud' | strip -%}{%- assign vk_end = vk_base | slice: -1, 1 -%}{%- if vk_end == '/' -%}{%- assign vk_len = vk_base | size | minus: 1 -%}{%- assign vk_base = vk_base | slice: 0, vk_len -%}{%- endif -%}{%- assign vk_filter = 'done = false' -%}{%- assign vk_done = 'done = true && done_at >= now/d' -%}{%- if mode == 'focus' -%}{%- assign vk_filter = vk_filter | append: ' && due_date < now/d+2d' -%}{%- endif -%}{%- assign vk_extra = filter | strip -%}{%- if vk_extra != '' -%}{%- assign vk_filter = vk_filter | append: ' && (' | append: vk_extra | append: ')' -%}{%- assign vk_done = vk_done | append: ' && (' | append: vk_extra | append: ')' -%}{%- endif -%}{%- assign vk_tz = trmnl.user.time_zone_iana | default: 'UTC' | url_encode -%}{%- assign vk_token = api_token | strip -%}{%- if vk_token == '' -%}{{ vk_base }}/api/v1/info{%- else -%}{{ vk_base }}/api/v1/tasks?per_page=250&filter={{ vk_filter | url_encode }}&filter_timezone={{ vk_tz }}{%- endif %}\r\n{% if vk_token != '' %}{{ vk_base }}/api/v1/projects?per_page=250{% endif %}\r\n{% if vk_token != '' and show_done_today != 'false' %}{{ vk_base }}/api/v1/tasks?per_page=250&filter={{ vk_done | url_encode }}&filter_timezone={{ vk_tz }}{% endif %}"
polling_headers: authorization=Bearer {{ api_token }}
polling_body: ''
id: 537779
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: base_url
  field_type: url
  name: Vikunja address
  description: 'Leave empty for Vikunja Cloud. For your own server, for example tasks.example.com.'
  description-de: 'Leer lassen für Vikunja Cloud. Für einen eigenen Server, zum Beispiel tasks.example.com.'
  placeholder: https://app.vikunja.cloud
  optional: true
- keyname: api_token
  field_type: password
  name: API token
  description: 'Create it in Vikunja under Settings, API Tokens, with Projects: Read All and Tasks: Read All. Without a token you see sample tasks.'
  description-de: 'In Vikunja unter Einstellungen, API-Tokens anlegen, mit Projects: Read All und Tasks: Read All. Ohne Token siehst du Beispielaufgaben.'
  optional: true
- keyname: projects
  field_type: string
  name: Projects
  description: 'Project names or IDs, separated by commas. Leave empty for all projects.'
  description-de: 'Projektnamen oder IDs, durch Kommas getrennt. Leer lassen für alle Projekte.'
  placeholder: Groceries, Home
  optional: true
- keyname: mode
  field_type: select
  name: Show
  description: Only due by tomorrow keeps overdue tasks and those due today or tomorrow.
  description-de: Nur bis morgen fällig zeigt Überfälliges und was heute oder morgen fällig ist.
  options:
  - All open tasks: all
  - Only due by tomorrow: focus
  default: all
- keyname: details
  field_type: select
  name: Task details
  description: Shown under each task, next to its due date and priority.
  description-de: Unter jeder Aufgabe, neben Fälligkeit und Priorität.
  options:
  - People and labels: all
  - People only: people
  - None: none
  default: all
- keyname: show_done_today
  field_type: boolean
  name: Done today
  description: Keep tasks finished today on the list, ticked off, until midnight.
  description-de: Heute erledigte Aufgaben bleiben bis Mitternacht abgehakt auf der Liste.
  default: 'true'
- keyname: filter
  field_type: string
  name: Advanced filter
  description: 'Optional Vikunja filter, for example priority >= 3.'
  description-de: 'Optionaler Vikunja-Filter, zum Beispiel priority >= 3.'
  placeholder: priority >= 3
  optional: true
- keyname: language
  field_type: select
  name: Language
  description: Auto uses the language of your TRMNL account.
  description-de: Auto nutzt die Sprache deines TRMNL-Kontos.
  options:
  - Auto: auto
  - Deutsch: de
  - English: en
  default: auto
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: productivity
  github_url: https://github.com/samumatic/trmnl-vikunja
  description: 'Your open Vikunja tasks as a calm checklist, the most pressing first.<br><br><b>What it shows</b><br>• A box per task; what you finish today stays, ticked off, until midnight<br>• Due dates in plain words: Today, Tomorrow, 3 days late<br>• Priority marks, people and labels<br>• One project, several or all; or only what is due by tomorrow<br><br><b>Setup</b><br>1. In Vikunja, open Settings, then API Tokens, and create a token with these permissions:<br>&nbsp;&nbsp;&nbsp;• Projects: Read All<br>&nbsp;&nbsp;&nbsp;• Tasks: Read All<br>2. Paste the token here. For your own server, also enter its address.<br>3. Optional: choose projects.<br><br>Read only. Without a token you see sample tasks. German or English.<br><br>Code and bug reports: <a href="https://github.com/samumatic/trmnl-vikunja" class="underline" target="_blank">GitHub</a>'
name: Vikunja Tasks
description: Open Vikunja tasks as a checklist
refresh_interval: 15
